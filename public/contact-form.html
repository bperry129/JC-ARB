<!DOCTYPE html>
<html>
<head>
  <title>Contact Form</title>
</head>
<body>
  <!-- This form is used for Netlify form detection during build time -->
  <!-- It won't be visible to users but helps Netlify detect the form structure -->
  <form name="contact" method="POST" action="/success" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <textarea name="message"></textarea>
    <button type="submit">Send</button>
  </form>
</body>
</html>
