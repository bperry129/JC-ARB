<!DOCTYPE html>
<html>
<head>
  <title>Netlify Form Template</title>
</head>
<body>
  <!-- 
    This is ONLY a template for Netlify to detect the form during build time.
    It should NOT be accessed directly by users.
    
    This file is named to avoid conflicts with Next.js routing.
  -->
  <form name="contact" data-netlify="true">
    <input type="hidden" name="form-name" value="contact" />
    <div>
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" />
    </div>
    <div>
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" />
    </div>
    <div>
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" />
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message"></textarea>
    </div>
    <button type="submit">Send</button>
  </form>
</body>
</html>
